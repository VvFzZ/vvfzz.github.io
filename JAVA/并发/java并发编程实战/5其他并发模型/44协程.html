<h2 id="title-44协程tags-description"><a href="#title-44协程tags-description" class="headerlink" title="title: 44协程tags:description:"></a>title: 44协程<br>tags:<br>description:</h2><p>一种轻量级的线程<br>协程是在用户态调度切换的成本更低,线程是在内核态中调度<br>协程比线程栈要小得多,协程栈的大小往往只有几K或者几十K，线程栈大小差不多有1M</p>
<p>线程同步意味着等待，线程等待是严重浪费。协程等待成本没那么高。</p>
