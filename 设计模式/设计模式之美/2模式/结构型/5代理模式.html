<h2 id="title-5代理模式description-5代理模式date-2025-06-26-15-01-48tags-设计模式"><a href="#title-5代理模式description-5代理模式date-2025-06-26-15-01-48tags-设计模式" class="headerlink" title="title: 5代理模式description: 5代理模式date: 2025-06-26 15:01:48tags: 设计模式"></a>title: 5代理模式<br>description: 5代理模式<br>date: 2025-06-26 15:01:48<br>tags: 设计模式</h2><p>在不改变原始类（或叫被代理类）的情况下，通过引入代理类来给原始类附加功能<br>一般情况下，让代理类和原始类实现同样的接口。<br>如果原始类并没有定义接口，并且原始类代码并不是我们开发维护的。可以让代理类继承原始类的方法来实现代理模式。</p>
